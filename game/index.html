<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palm Shores — a neon-night open-world crime game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0620;
    font-family: "Segoe UI", Arial, sans-serif; color: #f2f2f8; }
  #game-canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hud-top { position: absolute; top: 14px; left: 16px; display: flex; gap: 18px; align-items: center; }
  #hud-stars { font-size: 26px; letter-spacing: 4px; color: #ffd166; text-shadow: 0 0 12px rgba(255, 60, 60, .8); }
  #hud-stars.hot { color: #ff4040; animation: pulse .7s infinite alternate; }
  @keyframes pulse { from { opacity: .75; } to { opacity: 1; } }
  #hud-cash { font-size: 24px; font-weight: 800; color: #4ade80; text-shadow: 0 2px 8px #000; }
  #hud-objective { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(10, 6, 28, .75); border: 1px solid #c084fc; border-radius: 8px;
    padding: 8px 18px; font-size: 15px; font-weight: 600; color: #e9d5ff; max-width: 60vw; text-align: center; }
  #hud-bl { position: absolute; left: 16px; bottom: 16px; width: 230px; }
  .hud-label { font-size: 11px; letter-spacing: 2px; color: #cbd5e1; margin: 6px 0 3px; }
  .bar { height: 12px; background: rgba(0,0,0,.6); border: 1px solid #555; border-radius: 6px; overflow: hidden; }
  .fill { height: 100%; width: 100%; transition: width .2s; }
  .fill.health { background: linear-gradient(90deg, #16a34a, #4ade80); }
  .fill.armor { background: linear-gradient(90deg, #2563eb, #38bdf8); }
  #hud-ammo { margin-top: 8px; font-size: 15px; font-weight: 700; color: #fde68a; text-shadow: 0 2px 6px #000; }
  #hud-br { position: absolute; right: 16px; bottom: 16px; text-align: right; }
  #hud-speed { font-size: 26px; font-weight: 800; color: #fff; text-shadow: 0 2px 8px #000; margin-bottom: 6px; }
  #minimap { border: 2px solid rgba(192, 132, 252, .7); border-radius: 10px; background: rgba(10,6,28,.8); }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 22px; color: rgba(255,255,255,.85); text-shadow: 0 0 6px #000; display: none; }
  #hud-briefing { position: absolute; left: 50%; top: 18%; transform: translateX(-50%);
    width: min(560px, 80vw); background: rgba(10, 6, 28, .88); border-left: 4px solid #ff2e88;
    border-radius: 8px; padding: 12px 16px; font-size: 15px; line-height: 1.5; opacity: 0; transition: opacity .4s; }
  #hud-briefing.show { opacity: 1; }
  #hud-toast { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%);
    background: rgba(10, 6, 28, .85); border: 1px solid #22d3ee; border-radius: 8px;
    padding: 8px 16px; font-size: 15px; font-weight: 600; color: #a5f3fc; opacity: 0; transition: opacity .3s; }
  #hud-toast.show { opacity: 1; }
  #hud-flash { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(255,0,0,.45));
    opacity: 0; transition: opacity .1s; }
  #hud-flash.show { opacity: 1; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; gap: 14px; padding: 24px;
    background: linear-gradient(180deg, rgba(11,6,32,.82), rgba(30,8,60,.88)); pointer-events: auto; }
  .screen h1 { font-size: 64px; letter-spacing: 6px; font-weight: 900;
    background: linear-gradient(90deg, #ff2e88, #c084fc, #22d3ee);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(255, 46, 136, .35); }
  .tagline { font-size: 17px; color: #e9d5ff; letter-spacing: 1px; }
  .story { max-width: 620px; font-size: 15px; line-height: 1.65; color: #d6d6e8; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 28px; font-size: 14px;
    color: #cbd5e1; text-align: left; background: rgba(0,0,0,.35); padding: 14px 20px; border-radius: 10px; }
  .controls b { color: #ffd166; }
  button { pointer-events: auto; cursor: pointer; font-size: 18px; font-weight: 800; letter-spacing: 2px;
    color: #fff; background: linear-gradient(90deg, #ff2e88, #c084fc); border: none; border-radius: 10px;
    padding: 13px 34px; box-shadow: 0 4px 24px rgba(255, 46, 136, .45); }
  button:hover { filter: brightness(1.15); }
  button.secondary { background: rgba(255,255,255,.12); box-shadow: none; border: 1px solid #888; }
  .hint { font-size: 12px; color: #94a3b8; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
